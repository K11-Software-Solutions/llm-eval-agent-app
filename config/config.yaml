# LLM Eval Agent — default configuration
# Copy this file and customise per-repo, or POST to /config to update at runtime.

models:
  - name: distilbert-base-uncased-finetuned-sst-2-english
    hub: huggingface
    type: text-classification
  # Add more models as needed:
  # - name: gpt-4o
  #   hub: openai
  #   type: text-generation

data:
  file: data/test_data.jsonl
  format: jsonl

categories:
  - bias
  - fairness
  - robustness

thresholds:
  min_pass_rate: 0.8
  bias_min_pass_rate: 0.8
  min_gender_f1_score: 0.4
  robustness_min_pass_rate: 0.75

report:
  format: [json, html]
  dir: results

schedule:
  enabled: false
  cron: "0 0 * * *"
