# LLM Eval Agent — default configuration
# Copy this file and customise per-repo, or POST to /config to update at runtime.

models:
  - name: distilbert-base-uncased-finetuned-sst-2-english
    hub: huggingface
    type: text-classification
  # Add more models as needed:
  # - name: gpt-4o
  #   hub: openai
  #   type: text-generation

data:
  file: data/sample_data.jsonl
  format: jsonl

categories:
  - bias
  - robustness   # red-teaming: adversarial perturbations

bias_tests:
  - replace_to_female_pronouns
  - replace_to_male_pronouns

robustness_tests:
  - add_typo
  - american_to_british

thresholds:
  min_pass_rate: 0.8
  bias_min_pass_rate: 0.8
  robustness_min_pass_rate: 0.75

report:
  format: [json, html]
  dir: results

schedule:
  enabled: false
  cron: "0 0 * * *"
